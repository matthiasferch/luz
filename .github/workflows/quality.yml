name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: python -m pip install ruff==0.12.12

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:textures
      - run: npm run validate:shaders
      - run: npm test
      - run: npm run build
      - run: python integrations/blender/tests/studio_snapshot_test.py
      - run: npm run build:release
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: engine-release
          path: |
            dist/luz-*.tgz
            dist/luz-exporter.zip
          if-no-files-found: error

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BLENDER_VERSION: 5.0.1
      BLENDER_SHA256: 8019580ee1b7262e505f4196a00237ccf743c88d205b38d34201510676e60b09
      CHROME_PATH: /usr/bin/google-chrome
      LUZ_BLENDER_SKELETAL_FIXTURE: ${{ github.workspace }}/.tmp/skeletal-fixture/skeletal-manifest.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Install pinned Blender
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 3 --output "$archive" "https://download.blender.org/release/Blender5.0/$archive" ||
            curl --fail --location --retry 3 --output "$archive" "https://mirrors.dotsrc.org/blender/release/Blender5.0/$archive"
          printf '%s  %s\n' "$BLENDER_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --file "$archive"
          echo "BLENDER_PATH=$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Verify exported mesh normals
        run: |
          "$BLENDER_PATH" --background --factory-startup --offline-mode --python-exit-code 1 \
            --python integrations/blender/tests/mesh_normals_fixture.py

      - name: Verify Blender export publication
        run: |
          "$BLENDER_PATH" --background --factory-startup --offline-mode --python-exit-code 1 \
            --python integrations/blender/tests/export_pipeline_fixture.py

      - run: npm run test:fixture:skeletal
      - name: Compare exported poses against Blender
        working-directory: tests
        run: npx mocha -r ../tooling/register-assets.cjs -r ts-node/register integration/blender-skeletal-reload.test.ts
      - run: npm run build:engine
      - run: npm run test:gpu
      - run: npm run test:distribution:gpu

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: engine-release
          path: release
      - name: Publish the tested engine and Blender extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f "release/luz-${GITHUB_REF_NAME#v}.tgz"
          cd release
          sha256sum luz-*.tgz luz-exporter.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "luz $GITHUB_REF_NAME" --generate-notes luz-*.tgz luz-exporter.zip SHA256SUMS
